[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qstr"
version = "0.1.0"
description = "Structured derivative-free trust-region optimization for expensive quantum calibration"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = ["optimization", "derivative-free", "quantum-control", "trust-region"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "cobyqa==1.1.4"]

[project.optional-dependencies]
baselines = ["cma>=3.3,<5"]
test = ["pytest>=8,<9"]
dev = ["pytest>=8,<9", "build>=1.2,<2", "ruff>=0.9,<1"]

[project.scripts]
qstr = "qstr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["qstr", "qstr.*"]
namespaces = false

[tool.setuptools.package-data]
qstr = ["py.typed"]

[tool.pytest.ini_options]
testpaths = [
    "tests/test_qstr_solver.py",
    "tests/test_qstr_presets.py",
    "tests/test_qstr_baselines.py",
    "tests/test_qstr_package.py",
]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
include = ["src/qstr/**/*.py", "tests/test_qstr_*.py", "examples/*.py", "tools/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
